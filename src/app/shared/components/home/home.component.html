<div class="home_container">
  <mat-toolbar class="toolbar">
    <div class="logo-container">
      <div class="logo" [routerLink]="'/home'"></div>
    </div>
    <span>Noticias</span>
    <div class="sections-container ms-2">
      <button mat-flat-button class="me-2">Inicio</button>
      <button mat-flat-button [matMenuTriggerFor]="menu">Categorías</button>
    </div>
    <mat-menu #menu="matMenu">
      <button mat-menu-item class="section">Categoría 1</button>
      <button mat-menu-item class="section">Categoría 2</button>
    </mat-menu>

    <span class="example-spacer"></span>
    <button [matMenuTriggerFor]="menuProfile" mat-icon-button class="example-icon favorite-icon" aria-label="Example icon-button with heart icon">
      <mat-icon class="icon-close" >account_circle</mat-icon>
    </button>
    <mat-menu #menuProfile="matMenu">
      <button  mat-menu-item>
        <mat-icon>
          logout
        </mat-icon>
        Cerrar Sesión
      </button>
    </mat-menu>
  </mat-toolbar>
  <div class="content">
    <div class="row">
      <div class="titular-container col-sm-7">
        <div class="noticia-titular">
          <mat-card class="example-card">
            <mat-card-header>
              <div mat-card-avatar class="example-header-image"></div>
              <mat-card-title>Shiba Inu</mat-card-title>
              <mat-card-subtitle>Dog Breed</mat-card-subtitle>
            </mat-card-header>
            <img mat-card-image src="https://material.angular.io/assets/img/examples/shiba2.jpg" alt="Photo of a Shiba Inu">
            <mat-card-content>
              <p>
                Magistrados titulares del TSE quedan habilitados para retornar a sus funciones y Alfaro entrega la presidencia
              </p>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button>LIKE</button>
              <button mat-button>SHARE</button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>
      <div class="noticias-container col-sm-5">
        @for (noticia of noticias; track noticia){
          <mat-card class="noticia mat-elevation-z3">
            <mat-card-header>
              <div mat-card-avatar class="example-header-image me-3"></div>
              <h3>{{noticia.title}}</h3>
            </mat-card-header>
            <mat-card-content>
              <h3>{{noticia.description}}</h3>
            </mat-card-content>
          </mat-card>
        }
      </div>
    </div>
  </div>
</div>
